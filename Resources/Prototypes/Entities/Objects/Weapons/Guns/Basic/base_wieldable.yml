# A basic inheritable template for a gun that is wieldable and has the standard inaccuracy.
- type: entity
  id: BaseGunWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
    altUseInHand: true
  - type: GunWieldBonus
    minAngle: 1
    maxAngle: 10
    angleDecay: 1.0 # WWDP
  - type: Gun
    bonusAngleIncreaseMove: 10    # wwdp
    bonusAngleIncreaseTurn: 0.2  # wwdp
    bonusAngleDecay: 10           # wwdp
    maxBonusAngle: 10             # wwdp
    minAngle: 1
    maxAngle: 10 # WWDP
  - type: DisarmMalus # WWDP
    malus: 0.3
    wieldedBonus: 0.3
