- type: directorEvent
  id: BackalleyDeal
  name: "The Backalley Deal"
  announcerId: "CitiNet"
  announcementColor: "#51f542"
  startPhase: "Gathering"
  phases:
    Gathering:
      name: "Gathering"
      duration: 180 # 3 minutes
      announcement: "backalley-deal-gathering"
      locationTag: "Alley"
      spawns:
        - prototype: MobHumanSyndicateAgent # Gang A (Maelstrom)
          groupTag: "GangA"
          faction: "Passive" # Все нейтральны на старте
          amount: 2
        - prototype: MobHumanSyndicateAgent # Gang B (Valentino)
          groupTag: "GangB"
          faction: "Passive" # Все нейтральны на старте
          amount: 2
      nextPhases:
        Peace: 70
        Skirmish: 30

    Peace:
      name: "Peaceful Resolution"
      duration: 60
      announcement: "backalley-deal-peace"
      nextPhases:
        Retreat: 100

    Skirmish:
      name: "The Skirmish"
      duration: 600
      announcement: "backalley-deal-skirmish"
      aiDomain: "TacticalCombat"
      factionOverrides: # Смена фракций на враждебные
        GangA: "NCBandit"
        GangB: "NCMilitech"
      triggers:
        - type: MobKilled
          count: 2
      nextPhases:
        Retreat: 100

    Retreat:
      name: "Retreat"
      duration: 60
      announcement: "backalley-deal-retreat"
      aiDomain: "FleeToExtraction"
      cleanup: true
